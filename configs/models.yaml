llm:
  provider: ollama
  model: qwen2.5:3b
  temperature: 0.0

embedding:
  provider: huggingface
  model: BAAI/bge-base-en-v1.5
  batch_size: 32
  # BGE models work best when search questions (not documents) get this prefix.
  query_instruction: "Represent this sentence for searching relevant passages: "

reranker:
  enabled: false
  model: ""

model_runtime:
  parameter_size: "3B"
  context_window: null
  quantization: "Ollama default"
  hardware: "Intel i5-1235U, 16 GB RAM, Intel Iris Xe"